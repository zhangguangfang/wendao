name: Verify Huanhuan

on:
  push:
    branches: [main, 'iteration/**']
  pull_request:

permissions:
  contents: read

jobs:
  windows-updater:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise updater with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/update-core.tests.ps1
      - name: Exercise updater with PowerShell 7
        shell: pwsh
        run: ./tests/update-core.tests.ps1

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test -- --workers=2
        env:
          CI: true
